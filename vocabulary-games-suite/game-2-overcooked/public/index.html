<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Word Assembly Kitchen</title><link rel="stylesheet" href="/shared/theme.css"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand">LINGUAL <b>PLANET</b></div><span class="pill">Word Assembly Kitchen</span></header><main class="shell"><div class="hud"><div class="metric"><small>Score</small><strong id="score">0</strong></div><div class="metric"><small>Shift</small><strong id="time">1:30</strong></div><div class="metric wide"><small>Hands</small><strong id="held">Empty</strong></div></div><div class="layout"><section class="card ticket"><span class="eyebrow">Order #<b id="orderNo">1</b></span><h1 id="definition">Loading order…</h1><div id="recipe" class="recipe"></div><p id="message" aria-live="polite">Move to a station and press E.</p><button class="btn accent" id="reset">Restart shift</button></section><section class="canvas-wrap"><canvas id="game" width="800" height="560" aria-label="Top-down word assembly kitchen"></canvas><div class="legend">Move: WASD / arrows · Interact: E</div><div class="touch-controls" aria-label="Touch controls"><button data-key="arrowleft" aria-label="Move left">←</button><button data-key="arrowup" aria-label="Move up">↑</button><button data-key="arrowdown" aria-label="Move down">↓</button><button data-key="arrowright" aria-label="Move right">→</button><button data-action="interact" class="action">E · USE</button></div></section></div></main><script src="app.js"></script><script src="/shared/game-feedback.js"></script></body></html>
